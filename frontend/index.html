<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CertChain - Certification de diplômes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  button { padding: .4rem .9rem; margin: .3rem 0; cursor: pointer; }
  input { padding: .35rem; width: 100%; box-sizing: border-box; margin: .25rem 0; }
  pre { background: #f5f5f5; padding: .6rem; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #0a7d2c; } .ko { color: #b00020; }
</style>
</head>
<body>
<h1>CertChain</h1>
<button id="connect">Connecter MetaMask</button> <span id="account"></span>

<!-- PERSONNE A : page Admin -->
<section id="admin">
  <h2>Admin : gérer les émetteurs</h2>
  <input id="issuerAddr" placeholder="Adresse de l'émetteur (0x...)">
  <button id="addIssuer">Ajouter</button>
  <button id="removeIssuer">Retirer</button>
  <pre id="adminOut"></pre>
</section>

<!-- PERSONNE B : page Émission -->
<section id="issue">
  <h2>Émission d'un certificat</h2>
  <input type="file" id="issueFile">
  <label>Date d'expiration <input type="date" id="expDate"></label>
  <button id="issueBtn">Émettre</button>
  <pre id="issueOut"></pre>
</section>

<!-- PERSONNE C : page Vérification / Révocation -->
<section id="verify">
  <h2>Vérification publique</h2>
  <input type="file" id="verifyFile">
  <button id="verifyBtn">Vérifier</button>
  <pre id="verifyOut"></pre>
  <h3>Révocation (émetteur d'origine)</h3>
  <input id="reason" placeholder="Motif">
  <button id="revokeBtn">Révoquer le fichier sélectionné</button>
  <pre id="revokeOut"></pre>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="contract-config.js"></script>
<script>
const ABI = [
  "function admin() view returns (address)",
  "function issuers(address) view returns (bool)",
  "function addIssuer(address a)",
  "function removeIssuer(address a)",
  "function issueCertificate(bytes32 hash, uint64 expiresAt)",
  "function revokeCertificate(bytes32 hash, string reason)",
  "function verifyCertificate(bytes32 hash) view returns (uint8 status, address issuer, uint64 issuedAt, uint64 expiresAt, string reason)",
];
const STATUS = ["Inconnu", "Valide", "Révoqué", "Expiré"];
let signer, contract;
const $ = (id) => document.getElementById(id);

async function sha256File(file) {
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest("SHA-256", buf);
  return "0x" + [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function show(id, msg, ok = true) { $(id).textContent = msg; $(id).className = ok ? "ok" : "ko"; }
function errMsg(e) { return e.reason || e.shortMessage || e.message; }

$("connect").onclick = async () => {
  if (!window.ethereum) return alert("MetaMask non détecté");
  const provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  contract = new ethers.Contract(window.CONTRACT_ADDRESS, ABI, signer);
  $("account").textContent = await signer.getAddress();
};

async function run(outId, fn) {
  try { show(outId, "Transaction en cours..."); show(outId, await fn(), true); }
  catch (e) { show(outId, "REJETÉ : " + errMsg(e), false); }
}

$("addIssuer").onclick = () => run("adminOut", async () => {
  const tx = await contract.addIssuer($("issuerAddr").value); await tx.wait(); return "Émetteur ajouté";
});
$("removeIssuer").onclick = () => run("adminOut", async () => {
  const tx = await contract.removeIssuer($("issuerAddr").value); await tx.wait(); return "Émetteur retiré";
});
$("issueBtn").onclick = () => run("issueOut", async () => {
  const hash = await sha256File($("issueFile").files[0]);
  const exp = Math.floor(new Date($("expDate").value).getTime() / 1000);
  const tx = await contract.issueCertificate(hash, exp); await tx.wait();
  return "Certificat émis\nHash : " + hash;
});
$("verifyBtn").onclick = () => run("verifyOut", async () => {
  const hash = await sha256File($("verifyFile").files[0]);
  const r = await contract.verifyCertificate(hash);
  return `Résultat : ${STATUS[Number(r.status)]}\nHash : ${hash}\nÉmetteur : ${r.issuer}\nExpire : ${r.expiresAt ? new Date(Number(r.expiresAt) * 1000).toLocaleDateString() : "-"}\nMotif : ${r.reason || "-"}`;
});
$("revokeBtn").onclick = () => run("revokeOut", async () => {
  const hash = await sha256File($("verifyFile").files[0]);
  const tx = await contract.revokeCertificate(hash, $("reason").value); await tx.wait(); return "Certificat révoqué";
});
</script>
</body>
</html>
